name: Compilación
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: javac -d out src/concesionario/*.java
      - run: timeout 60 java -cp out concesionario.Principal
